<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1A4D2E">
  <meta name="robots" content="noindex">
  <title>You're offline · TeacherCo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#F5EFE6;color:#1E2420;font-family:system-ui,sans-serif}
    main{width:100%;max-width:430px;padding:36px;background:white;border:1px solid #E8DFCA;border-radius:24px;box-shadow:0 12px 35px #1238200d}
    img{width:64px;height:64px}strong{display:block;color:#1A4D2E;margin-top:12px}h1{font-size:30px;letter-spacing:-1px;margin:24px 0 12px}
    p{color:#58635b;line-height:1.7}button{margin-top:16px;padding:14px 22px;min-height:48px;background:#1A4D2E;color:white;border:0;border-radius:12px;font:600 15px system-ui;cursor:pointer}button:focus-visible{outline:3px solid #4F6F52;outline-offset:4px}small{display:block;margin-top:20px;color:#58635b;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="64" height="64">
    <strong>TeacherCo</strong>
    <h1>You're offline.</h1>
    <p>TeacherCo can't reach the server right now. Reconnect to continue using online features.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <small>Your classroom records aren't stored in this offline page.</small>
  </main>
</body>
</html>
